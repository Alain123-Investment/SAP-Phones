<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SAP MOBILE - Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0a0f1a;color:#e2e8f0}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{max-width:960px;margin:auto;min-height:100vh;padding:16px}
.login-box{max-width:380px;margin:80px auto;background:#111827;border:1px solid #1e293b;border-radius:20px;padding:28px}
.login-box h1{text-align:center;margin:0 0 8px;color:#38bdf8}
.login-box p{text-align:center;color:#94a3b8;font-size:13px;margin-bottom:20px}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:#94a3b8;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#fff;outline:none}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;width:100%;background:#0ea5e9;color:#fff}
.btn.green{background:#16a34a}.btn.red{background:#dc2626}.btn.gray{background:#334155}.btn.orange{background:#ea580c}
.btn.sm{width:auto;padding:8px 12px;font-size:12px;margin:2px}
header{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #1e293b;margin-bottom:16px;flex-wrap:wrap}
header h1{margin:0;font-size:20px;color:#38bdf8;flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:#1e293b;border:1px solid #334155;color:#94a3b8;border-radius:10px;padding:10px 12px;font-weight:700;font-size:12px}
.tabs button.on{background:#0ea5e9;color:#fff;border-color:#0ea5e9}
.card{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:15px}
.muted{color:#94a3b8;font-size:12px}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700}
.pill.pending{background:#7c2d12;color:#fdba74}
.pill.approved,.pill.active,.pill.completed,.pill.done{background:#14532d;color:#86efac}
.pill.rejected,.pill.suspended{background:#7f1d1d;color:#fca5a5}
.pill.locked{background:#1e3a5f;color:#93c5fd}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.stat{background:#111827;border:1px solid #1e293b;border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px;color:#38bdf8;margin-top:4px}
.stat span{font-size:11px;color:#94a3b8}
.search{margin-bottom:12px}
.search input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#fff}
.empty{text-align:center;padding:30px;color:#64748b}
.hidden{display:none}
.modal{display:none;position:fixed;inset:0;background:#000a;z-index:50;padding:20px;align-items:center;justify-content:center}
.modal.show{display:flex}
.modalbox{width:min(420px,100%);background:#111827;border:1px solid #334155;border-radius:18px;padding:20px;max-height:90vh;overflow:auto}
.modalbox h2{margin:0 0 14px;font-size:18px}
.fee-line{background:#0f172a;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:13px}
.fee-line b{color:#fbbf24}
</style>
</head>
<body>
<div class="app">

<div id="loginScreen" class="login-box">
<h1>🔐 Admin</h1>
<p>SAP MOBILE – Ubuyobozi</p>
<div class="field"><label>Ijambo ry'ibanga ry'umuyobozi</label>
<input id="adminPass" type="password" placeholder="Andika password" onkeydown="if(event.key==='Enter')adminLogin()">
</div>
<button class="btn" onclick="adminLogin()">Injira</button>
<p id="loginMsg" class="muted" style="margin-top:12px;text-align:center"></p>
</div>

<div id="dashScreen" class="hidden">
<header>
<h1>📱 SAP MOBILE Admin</h1>
<button class="btn gray sm" onclick="adminLogout()">Sohoka</button>
</header>

<div class="stats" id="statsBox">
<div class="stat"><span>Abakoresha</span><b id="statUsers">-</b></div>
<div class="stat"><span>Deposit bitegereje</span><b id="statDep">-</b></div>
<div class="stat"><span>Withdraw bitegereje</span><b id="statWith">-</b></div>
<div class="stat"><span>Imigabane</span><b id="statInv">-</b></div>
<div class="stat"><span>Gift codes</span><b id="statGift">-</b></div>
</div>

<div class="tabs">
<button class="on" id="tabUsers" onclick="showTab('users')">👥 Abakoresha</button>
<button id="tabDeposits" onclick="showTab('deposits')">💰 Deposits</button>
<button id="tabWithdrawals" onclick="showTab('withdrawals')">💸 Withdrawals</button>
<button id="tabInvestments" onclick="showTab('investments')">📈 Imigabane</button>
<button id="tabGifts" onclick="showTab('gifts')">🎁 Gift Codes</button>
<button id="tabSupport" onclick="showTab('support')">🎧 Support</button>
</div>

<div id="panelUsers">
<div class="search"><input id="searchUser" placeholder="Shakisha amazina / nomero / kode..." oninput="filterUsers()"></div>
<div id="usersList"></div>
</div>

<div id="panelDeposits" class="hidden">
<div class="tabs" style="margin-bottom:10px">
<button class="on" id="depAll" onclick="filterDep('all')">Byose</button>
<button id="depPending" onclick="filterDep('pending')">Bitegereje</button>
<button id="depApproved" onclick="filterDep('approved')">Byemejwe</button>
</div>
<div id="depositsList"></div>
</div>

<div id="panelWithdrawals" class="hidden">
<div class="tabs" style="margin-bottom:10px">
<button class="on" id="withAll" onclick="filterWith('all')">Byose</button>
<button id="withPending" onclick="filterWith('pending')">Bitegereje</button>
<button id="withApproved" onclick="filterWith('approved')">Byemejwe</button>
</div>
<div id="withdrawalsList"></div>
</div>

<div id="panelInvestments" class="hidden">
<div class="tabs" style="margin-bottom:10px">
<button class="on" id="invAll" onclick="filterInv('all')">Byose</button>
<button id="invActive" onclick="filterInv('active')">Active</button>
<button id="invSuspended" onclick="filterInv('suspended')">Zahagaritswe</button>
</div>
<div id="investmentsList"></div>
</div>

<div id="panelGifts" class="hidden">
<div class="card">
<h3>Kora Gift Code nshya</h3>
<div class="field"><label>Kode (ex: GIFT-ABC123)</label><input id="newGiftCode" placeholder="GIFT-XXXXXX" style="text-transform:uppercase"></div>
<div class="field"><label>Amafaranga (RWF)</label><input id="newGiftAmount" type="number" min="100" placeholder="5000"></div>
<div class="field"><label>Inshuro ntarengwa (max uses)</label><input id="newGiftMax" type="number" min="1" value="100"></div>
<button class="btn green" onclick="createGift()">Kora Gift Code</button>
</div>
<div id="giftsList"></div>
</div>

<div id="panelSupport" class="hidden">
<div id="supportList"></div>
</div>

</div>
</div>

<!-- Edit User Modal -->
<div id="editUserModal" class="modal">
<div class="modalbox">
<h2>Hindura umukoresha</h2>
<input type="hidden" id="editUid">
<div class="field"><label>Amazina</label><input id="editName"></div>
<div class="field"><label>Nomero</label><input id="editPhone"></div>
<div class="field"><label>Balance (Ayo ufite)</label><input id="editBalance" type="number"></div>
<div class="field"><label>Withdrawable (Byemewe kubikuza)</label><input id="editWithdrawable" type="number"></div>
<div class="field"><label>Total earnings</label><input id="editTotalEarnings" type="number"></div>
<div class="field"><label>Status</label>
<select id="editStatus">
<option value="active">active</option>
<option value="suspended">suspended</option>
</select>
</div>
<div style="display:flex;gap:8px;margin-top:12px">
<button class="btn green" onclick="saveUserEdit()">Bika</button>
<button class="btn gray" onclick="closeEditUser()">Funga</button>
</div>
<button class="btn red" style="margin-top:10px" onclick="deleteUser()">Siba umukoresha</button>
</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getFirestore,collection,query,orderBy,limit,onSnapshot,doc,updateDoc,setDoc,deleteDoc,increment,getDoc,where,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyA3Eb3VveP4m0wSfPTO5kd4kOtOIaRL3_U",
  authDomain:"sap-phones.firebaseapp.com",
  projectId:"sap-phones",
  storageBucket:"sap-phones.firebasestorage.app",
  messagingSenderId:"865821975787",
  appId:"1:865821975787:web:48a4e9392d6366d2bacaae",
  measurementId:"G-EKSWTEG6ZL"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

// ========== ADMIN PASSWORD (hindura iyi) ==========
const ADMIN_PASSWORD = "admin1234";

const $=id=>document.getElementById(id);
const money=n=>Number(n||0).toLocaleString()+" RWF";
const fmtDate=ts=>{
  if(!ts) return "-";
  if(ts?.seconds){const d=new Date(ts.seconds*1000);return d.toLocaleDateString("rw-RW")+" "+d.toLocaleTimeString("rw-RW",{hour:"2-digit",minute:"2-digit"});}
  try{return new Date(ts).toLocaleString("rw-RW");}catch{return "-";}
};

let allUsers=[], allDeposits=[], allWithdrawals=[], allInvestments=[], allGifts=[], allSupport=[];
let depFilter="all", withFilter="all", invFilter="all";
let unsubs=[];

window.adminLogin=function(){
  const pass=$("adminPass").value;
  if(pass===ADMIN_PASSWORD){
    sessionStorage.setItem("sap_admin","1");
    $("loginScreen").classList.add("hidden");
    $("dashScreen").classList.remove("hidden");
    startListeners();
  }else{
    $("loginMsg").textContent="❌ Ijambo ry'ibanga si ryo.";
  }
};

window.adminLogout=function(){
  sessionStorage.removeItem("sap_admin");
  unsubs.forEach(u=>u&&u());
  unsubs=[];
  $("dashScreen").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");
  $("adminPass").value="";
};

if(sessionStorage.getItem("sap_admin")==="1"){
  $("loginScreen").classList.add("hidden");
  $("dashScreen").classList.remove("hidden");
  startListeners();
}

function startListeners(){
  unsubs.push(onSnapshot(query(collection(db,"users"),limit(300)),snap=>{
    allUsers=snap.docs.map(d=>({id:d.id,...d.data()}));
    $("statUsers").textContent=allUsers.length;
    renderUsers();
  }));

  unsubs.push(onSnapshot(query(collection(db,"deposits"),limit(150)),snap=>{
    allDeposits=snap.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    $("statDep").textContent=allDeposits.filter(d=>d.status==="pending").length;
    renderDeposits();
  }));

  unsubs.push(onSnapshot(query(collection(db,"withdrawals"),limit(150)),snap=>{
    allWithdrawals=snap.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    $("statWith").textContent=allWithdrawals.filter(d=>d.status==="pending").length;
    renderWithdrawals();
  }));

  unsubs.push(onSnapshot(query(collection(db,"investments"),limit(200)),snap=>{
    allInvestments=snap.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    $("statInv").textContent=allInvestments.filter(i=>i.status==="active").length;
    renderInvestments();
  }));

  unsubs.push(onSnapshot(query(collection(db,"giftCodes"),limit(100)),snap=>{
    allGifts=snap.docs.map(d=>({id:d.id,...d.data()}));
    $("statGift").textContent=allGifts.filter(g=>g.active!==false).length;
    renderGifts();
  },()=>{$("statGift").textContent="0";$("giftsList").innerHTML="<div class='empty'>Nta gift codes (cyangwa collection ntihari)</div>";}));

  unsubs.push(onSnapshot(query(collection(db,"supportTickets"),limit(50)),snap=>{
    allSupport=snap.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    renderSupport();
  },()=>{$("supportList").innerHTML="<div class='empty'>Nta tickets</div>";}));
}

window.showTab=function(name){
  ["users","deposits","withdrawals","investments","gifts","support"].forEach(t=>{
    const panel=$("panel"+t.charAt(0).toUpperCase()+t.slice(1));
    const tab=$("tab"+t.charAt(0).toUpperCase()+t.slice(1));
    if(panel)panel.classList.add("hidden");
    if(tab)tab.classList.remove("on");
  });
  const panel=$("panel"+name.charAt(0).toUpperCase()+name.slice(1));
  const tab=$("tab"+name.charAt(0).toUpperCase()+name.slice(1));
  if(panel)panel.classList.remove("hidden");
  if(tab)tab.classList.add("on");
};

// ========== USERS ==========
function renderUsers(){
  const q=($("searchUser")?.value||"").toLowerCase();
  const list=allUsers.filter(u=>{
    if(!q) return true;
    return (u.name||"").toLowerCase().includes(q)||(u.phone||"").includes(q)||(u.referralCode||"").toLowerCase().includes(q)||(u.email||"").toLowerCase().includes(q);
  });
  if(!list.length){$("usersList").innerHTML="<div class='empty'>Nta mukoresha</div>";return}
  $("usersList").innerHTML=list.map(u=>`
    <div class="card">
      <div class="row">
        <div>
          <h3>${u.name||"-"} <span class="pill ${u.status==="suspended"?"suspended":"active"}">${u.status||"active"}</span></h3>
          <div class="muted">${u.phone||"-"} • Kode: ${u.referralCode||"-"}</div>
          <div class="muted" style="margin-top:4px">
            Balance: <b style="color:#38bdf8">${money(u.balance)}</b> •
            Withdrawable: <b style="color:#4ade80">${money(u.withdrawable)}</b> •
            Total earnings: ${money(u.totalEarnings||u.profit)}
          </div>
          <div class="muted">InvitedBy: ${u.invitedBy||"-"} • hasInvestment: ${u.hasInvestment?"Yego":"Oya"}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:4px">
          <button class="btn sm gray" onclick="openEditUser('${u.id}')">Hindura</button>
          <button class="btn sm orange" onclick="quickBalance('${u.id}',${Number(u.balance||0)})">Balance</button>
        </div>
      </div>
    </div>`).join("");
}
window.filterUsers=function(){renderUsers()};

window.quickBalance=async function(uid,current){
  const val=prompt("Andika balance nshya (RWF):",current);
  if(val===null) return;
  const num=Number(val);
  if(isNaN(num)||num<0){alert("Umubare si wo.");return}
  try{
    await updateDoc(doc(db,"users",uid),{balance:num});
    alert("✅ Balance yahinduwe.");
  }catch(e){alert("Ikibazo: "+e.message)}
};

window.openEditUser=function(uid){
  const u=allUsers.find(x=>x.id===uid);
  if(!u)return;
  $("editUid").value=uid;
  $("editName").value=u.name||"";
  $("editPhone").value=u.phone||"";
  $("editBalance").value=Number(u.balance||0);
  $("editWithdrawable").value=Number(u.withdrawable||0);
  $("editTotalEarnings").value=Number(u.totalEarnings||u.profit||0);
  $("editStatus").value=u.status==="suspended"?"suspended":"active";
  $("editUserModal").classList.add("show");
};
window.closeEditUser=function(){$("editUserModal").classList.remove("show")};

window.saveUserEdit=async function(){
  const uid=$("editUid").value;
  if(!uid)return;
  try{
    await updateDoc(doc(db,"users",uid),{
      name:($("editName").value||"").trim(),
      phone:($("editPhone").value||"").trim(),
      balance:Number($("editBalance").value)||0,
      withdrawable:Number($("editWithdrawable").value)||0,
      totalEarnings:Number($("editTotalEarnings").value)||0,
      status:$("editStatus").value||"active"
    });
    alert("✅ Byabitswe.");
    closeEditUser();
  }catch(e){alert("Ikibazo: "+e.message)}
};

window.deleteUser=async function(){
  const uid=$("editUid").value;
  if(!uid)return;
  if(!confirm("Siba uyu mukoresha? Ntibisubirwaho.")) return;
  try{
    await deleteDoc(doc(db,"users",uid));
    alert("Umukoresha yasibwe.");
    closeEditUser();
  }catch(e){alert("Ikibazo: "+e.message)}
};

// ========== DEPOSITS ==========
window.filterDep=function(f){
  depFilter=f;
  ["depAll","depPending","depApproved"].forEach(id=>{if($(id))$(id).classList.remove("on")});
  if(f==="all")$("depAll").classList.add("on");
  if(f==="pending")$("depPending").classList.add("on");
  if(f==="approved")$("depApproved").classList.add("on");
  renderDeposits();
};

function renderDeposits(){
  let list=allDeposits;
  if(depFilter!=="all") list=list.filter(d=>d.status===depFilter);
  if(!list.length){$("depositsList").innerHTML="<div class='empty'>Nta deposit</div>";return}
  $("depositsList").innerHTML=list.map(d=>{
    const user=allUsers.find(u=>u.id===d.uid||u.id===d.userId);
    return `<div class="card">
      <div class="row">
        <div>
          <h3>${money(d.amount)}</h3>
          <div class="muted">${user?.name||d.userName||d.uid} • ${user?.phone||d.userPhone||"-"}</div>
          <div class="muted">Yishyuye na: ${d.payerPhone||"-"} • ${fmtDate(d.createdAt)}</div>
          <div class="muted">Ref: ${d.reference||"-"} • Method: ${d.paymentMethod||"MTN"}</div>
        </div>
        <div style="text-align:right">
          <span class="pill ${d.status}">${d.status==="pending"?"Bitegereje":d.status==="approved"?"Byemejwe":d.status}</span>
          ${d.status==="pending"?`<div style="margin-top:8px">
            <button class="btn sm green" onclick="approveDeposit('${d.id}','${d.uid||d.userId}',${Number(d.amount||0)})">Emeza</button>
            <button class="btn sm red" onclick="rejectDeposit('${d.id}')">Anga</button>
          </div>`:""}
        </div>
      </div>
    </div>`;
  }).join("");
}

window.approveDeposit=async function(depId,uid,amount){
  if(!confirm("Emeza deposit ya "+money(amount)+"?")) return;
  try{
    await updateDoc(doc(db,"deposits",depId),{status:"approved",processedAt:serverTimestamp()});
    await updateDoc(doc(db,"users",uid),{balance:increment(Number(amount))});
    alert("✅ Deposit yemejwe. Balance yahinduwe.");
  }catch(e){alert("Ikibazo: "+e.message)}
};

window.rejectDeposit=async function(depId){
  if(!confirm("Anga iyi deposit?")) return;
  try{
    await updateDoc(doc(db,"deposits",depId),{status:"rejected",processedAt:serverTimestamp()});
    alert("Deposit yanzwe.");
  }catch(e){alert("Ikibazo: "+e.message)}
};

// ========== WITHDRAWALS (with 8% fee) ==========
window.filterWith=function(f){
  withFilter=f;
  ["withAll","withPending","withApproved"].forEach(id=>{if($(id))$(id).classList.remove("on")});
  if(f==="all")$("withAll").classList.add("on");
  if(f==="pending")$("withPending").classList.add("on");
  if(f==="approved")$("withApproved").classList.add("on");
  renderWithdrawals();
};

function renderWithdrawals(){
  let list=allWithdrawals;
  if(withFilter!=="all") list=list.filter(d=>d.status===withFilter);
  if(!list.length){$("withdrawalsList").innerHTML="<div class='empty'>Nta withdrawal</div>";return}
  $("withdrawalsList").innerHTML=list.map(d=>{
    const user=allUsers.find(u=>u.id===d.uid||u.id===d.userId);
    const gross=Number(d.grossAmount||d.amount||0);
    const fee=Number(d.fee||Math.floor(gross*0.08));
    const net=Number(d.netAmount||(gross-fee));
    return `<div class="card">
      <div class="row">
        <div>
          <h3>Wasabye: ${money(gross)}</h3>
          <div class="fee-line">Fee 8%: <b>${money(fee)}</b> → <b style="color:#4ade80">Wohereze: ${money(net)}</b></div>
          <div class="muted">${user?.name||d.userName||d.uid} • ${user?.phone||d.userPhone||"-"}</div>
          <div class="muted">Yoherezwa kuri: <b>${d.phone||"-"}</b> • ${fmtDate(d.createdAt)}</div>
        </div>
        <div style="text-align:right">
          <span class="pill ${d.status}">${d.status==="pending"?"Bitegereje":d.status==="approved"?"Byemejwe":d.status}</span>
          ${d.status==="pending"?`<div style="margin-top:8px">
            <button class="btn sm green" onclick="approveWithdraw('${d.id}',${net})">Emeza (ohereza ${money(net)})</button>
            <button class="btn sm red" onclick="rejectWithdraw('${d.id}','${d.uid||d.userId}',${gross})">Anga</button>
          </div>`:""}
        </div>
      </div>
    </div>`;
  }).join("");
}

window.approveWithdraw=async function(id,net){
  if(!confirm("Emeza withdrawal?\nWohereze net: "+money(net)+"\n(Fee 8% yamaze kuvaho)")) return;
  try{
    await updateDoc(doc(db,"withdrawals",id),{status:"approved",processedAt:serverTimestamp(),paidNet:net});
    alert("✅ Withdrawal yemejwe. Ohereza "+money(net)+" kuri nomero yanyanditse.");
  }catch(e){alert("Ikibazo: "+e.message)}
};

window.rejectWithdraw=async function(id,uid,gross){
  if(!confirm("Anga withdrawal? Amafaranga (gross) azasubizwa muri withdrawable.")) return;
  try{
    await updateDoc(doc(db,"withdrawals",id),{status:"rejected",processedAt:serverTimestamp()});
    if(uid) await updateDoc(doc(db,"users",uid),{withdrawable:increment(Number(gross)||0)});
    alert("Withdrawal yanzwe. Amafaranga yasubijwe kuri withdrawable.");
  }catch(e){alert("Ikibazo: "+e.message)}
};

// ========== INVESTMENTS ==========
window.filterInv=function(f){
  invFilter=f;
  ["invAll","invActive","invSuspended"].forEach(id=>{if($(id))$(id).classList.remove("on")});
  if(f==="all")$("invAll").classList.add("on");
  if(f==="active")$("invActive").classList.add("on");
  if(f==="suspended")$("invSuspended").classList.add("on");
  renderInvestments();
};

function renderInvestments(){
  let list=allInvestments;
  if(invFilter!=="all") list=list.filter(i=>(i.status||"active")===invFilter);
  if(!list.length){$("investmentsList").innerHTML="<div class='empty'>Nta mugabane</div>";return}
  $("investmentsList").innerHTML=list.map(inv=>{
    const user=allUsers.find(u=>u.id===inv.uid);
    const st=inv.status||"active";
    return `<div class="card">
      <div class="row">
        <div>
          <h3>${inv.shareName||inv.shareId||"VIP"}</h3>
          <div class="muted">${user?.name||inv.uid} • ${user?.phone||"-"}</div>
          <div class="muted">${money(inv.amount)} • Buri munsi: ${money(inv.daily||0)} • ${fmtDate(inv.createdAt)}</div>
          <div class="muted">shareId: ${inv.shareId||"-"}</div>
        </div>
        <div style="text-align:right">
          <span class="pill ${st}">${st==="active"?"Birakora":st==="suspended"?"Zahagaritswe":st}</span>
          <div style="margin-top:8px">
            ${st!=="active"?`<button class="btn sm green" onclick="setInvestStatus('${inv.id}','active')">Kora Active</button>`:""}
            ${st==="active"?`<button class="btn sm orange" onclick="setInvestStatus('${inv.id}','suspended')">Hagarika</button>`:""}
            <button class="btn sm red" onclick="deleteInvest('${inv.id}')">Siba</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join("");
}

window.setInvestStatus=async function(id,status){
  const msg=status==="active"?"Shyira muri active?":"Hagarika uyu mugabane? (ntuzakomeza kubona inyungu)";
  if(!confirm(msg)) return;
  try{
    await updateDoc(doc(db,"investments",id),{status,updatedAt:serverTimestamp()});
    alert("✅ Status yahinduwe: "+status);
  }catch(e){alert("Ikibazo: "+e.message)}
};

window.deleteInvest=async function(id){
  if(!confirm("Siba uyu mugabane? Ntibisubirwaho.")) return;
  try{
    await deleteDoc(doc(db,"investments",id));
    alert("Umugabane wasibwe.");
  }catch(e){alert("Ikibazo: "+e.message)}
};

// ========== GIFT CODES ==========
function renderGifts(){
  if(!allGifts.length){$("giftsList").innerHTML="<div class='empty'>Nta gift codes</div>";return}
  $("giftsList").innerHTML=allGifts.map(g=>{
    const used=(g.usedBy&&g.usedBy.length)||g.usedCount||0;
    return `<div class="card">
      <div class="row">
        <div>
          <h3>${g.id}</h3>
          <div class="muted">Bonus: <b style="color:#4ade80">${money(g.amount)}</b> • Yakoreshejwe: ${used}${g.maxUses?" / "+g.maxUses:""}</div>
        </div>
        <div>
          <span class="pill ${g.active===false?"rejected":"active"}">${g.active===false?"Off":"Active"}</span>
          <div style="margin-top:6px">
            <button class="btn sm gray" onclick="toggleGift('${g.id}',${g.active===false})">${g.active===false?"Kora Active":"Hagarika"}</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join("");
}

window.createGift=async function(){
  const code=($("newGiftCode").value||"").trim().toUpperCase();
  const amount=Number($("newGiftAmount").value);
  const maxUses=Number($("newGiftMax").value)||100;
  if(!code||code.length<4){alert("Andika kode.");return}
  if(!amount||amount<100){alert("Amafaranga ntoya ni 100.");return}
  try{
    await setDoc(doc(db,"giftCodes",code),{
      amount,active:true,maxUses,usedBy:[],usedCount:0,createdAt:serverTimestamp()
    });
    alert("✅ Gift code "+code+" yakozwe: "+money(amount));
    $("newGiftCode").value="";$("newGiftAmount").value="";
  }catch(e){alert("Ikibazo: "+e.message)}
};

window.toggleGift=async function(id,activate){
  try{
    await updateDoc(doc(db,"giftCodes",id),{active:!!activate});
  }catch(e){alert("Ikibazo: "+e.message)}
};

// ========== SUPPORT ==========
function renderSupport(){
  if(!allSupport.length){$("supportList").innerHTML="<div class='empty'>Nta tickets</div>";return}
  $("supportList").innerHTML=allSupport.map(t=>`
    <div class="card">
      <div class="row">
        <div>
          <h3>${t.phone||t.uid||"-"}</h3>
          <div class="muted">${t.message||"-"}</div>
          <div class="muted">${fmtDate(t.createdAt)}</div>
        </div>
        <span class="pill ${t.status==="open"?"pending":"completed"}">${t.status||"open"}</span>
      </div>
      ${t.status==="open"?`<button class="btn sm gray" style="margin-top:8px" onclick="closeTicket('${t.id}')">Funga</button>`:""}
    </div>`).join("");
}

window.closeTicket=async function(id){
  try{await updateDoc(doc(db,"supportTickets",id),{status:"closed"});}catch(e){alert(e.message)}
};
</script>
