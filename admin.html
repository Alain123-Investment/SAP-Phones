<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SAP Phones - Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#0a0f1a;color:#e2e8f0}
button,input,select{font:inherit}button{cursor:pointer}
.app{max-width:900px;margin:auto;min-height:100vh;padding:16px}
.login-box{max-width:380px;margin:80px auto;background:#111827;border:1px solid #1e293b;border-radius:20px;padding:28px}
.login-box h1{text-align:center;margin:0 0 8px;color:#38bdf8}
.login-box p{text-align:center;color:#94a3b8;font-size:13px;margin-bottom:20px}
.field{margin-bottom:12px}.field label{display:block;font-size:12px;color:#94a3b8;margin-bottom:5px}
.field input,.field select{width:100%;padding:12px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#fff;outline:none}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;width:100%;background:#0ea5e9;color:#fff}
.btn.green{background:#16a34a}.btn.red{background:#dc2626}.btn.gray{background:#334155}
.btn.sm{width:auto;padding:8px 14px;font-size:13px;margin:2px}
header{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #1e293b;margin-bottom:16px;flex-wrap:wrap}
header h1{margin:0;font-size:20px;color:#38bdf8;flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tabs button{background:#1e293b;border:1px solid #334155;color:#94a3b8;border-radius:10px;padding:10px 14px;font-weight:700;font-size:13px}
.tabs button.on{background:#0ea5e9;color:#fff;border-color:#0ea5e9}
.card{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:15px}
.muted{color:#94a3b8;font-size:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700}
.pill.pending{background:#7c2d12;color:#fdba74}
.pill.approved,.pill.active,.pill.completed{background:#14532d;color:#86efac}
.pill.rejected{background:#7f1d1d;color:#fca5a5}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat{background:#111827;border:1px solid #1e293b;border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-size:22px;color:#38bdf8;margin-top:4px}
.stat span{font-size:12px;color:#94a3b8}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:10px 8px;text-align:left;border-bottom:1px solid #1e293b}
th{color:#94a3b8;font-weight:600;font-size:11px;text-transform:uppercase}
.actions-cell{display:flex;gap:4px;flex-wrap:wrap}
.search{margin-bottom:12px}
.search input{width:100%;padding:11px 14px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#fff}
.empty{text-align:center;padding:30px;color:#64748b}
.hidden{display:none}
@media(max-width:600px){th:nth-child(3),td:nth-child(3){display:none}}
</style>
</head>
<body>
<div class="app">

<!-- LOGIN -->
<div id="loginScreen" class="login-box">
<h1>🔐 Admin</h1>
<p>SAP Phones – Ubuyobozi</p>
<div class="field"><label>Ijambo ry'ibanga ry'umuyobozi</label>
<input id="adminPass" type="password" placeholder="Andika password" onkeydown="if(event.key==='Enter')adminLogin()">
</div>
<button class="btn" onclick="adminLogin()">Injira</button>
<p id="loginMsg" class="muted" style="margin-top:12px;text-align:center"></p>
</div>

<!-- DASHBOARD -->
<div id="dashScreen" class="hidden">
<header>
<h1>📱 SAP Admin</h1>
<button class="btn gray sm" onclick="adminLogout()">Sohoka</button>
</header>

<div class="stats" id="statsBox">
<div class="stat"><span>Abakoresha</span><b id="statUsers">-</b></div>
<div class="stat"><span>Deposit bitegereje</span><b id="statDep">-</b></div>
<div class="stat"><span>Withdraw bitegereje</span><b id="statWith">-</b></div>
<div class="stat"><span>Imigabane</span><b id="statInv">-</b></div>
</div>

<div class="tabs">
<button class="on" id="tabUsers" onclick="showTab('users')">👥 Abakoresha</button>
<button id="tabDeposits" onclick="showTab('deposits')">💰 Deposits</button>
<button id="tabWithdrawals" onclick="showTab('withdrawals')">💸 Withdrawals</button>
<button id="tabInvestments" onclick="showTab('investments')">📈 Imigabane</button>
</div>

<!-- USERS TAB -->
<div id="panelUsers">
<div class="search"><input id="searchUser" placeholder="Shakisha amazina / nomero..." oninput="filterUsers()"></div>
<div id="usersList"></div>
</div>

<!-- DEPOSITS TAB -->
<div id="panelDeposits" class="hidden">
<div class="tabs" style="margin-bottom:10px">
<button class="on" id="depAll" onclick="filterDep('all')">Byose</button>
<button id="depPending" onclick="filterDep('pending')">Bitegereje</button>
<button id="depApproved" onclick="filterDep('approved')">Byemejwe</button>
</div>
<div id="depositsList"></div>
</div>

<!-- WITHDRAWALS TAB -->
<div id="panelWithdrawals" class="hidden">
<div class="tabs" style="margin-bottom:10px">
<button class="on" id="withAll" onclick="filterWith('all')">Byose</button>
<button id="withPending" onclick="filterWith('pending')">Bitegereje</button>
<button id="withApproved" onclick="filterWith('approved')">Byemejwe</button>
</div>
<div id="withdrawalsList"></div>
</div>

<!-- INVESTMENTS TAB -->
<div id="panelInvestments" class="hidden">
<div id="investmentsList"></div>
</div>

</div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getFirestore,collection,query,orderBy,limit,onSnapshot,doc,updateDoc,increment,getDoc,where} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyA3Eb3VveP4m0wSfPTO5kd4kOtOIaRL3_U",
  authDomain:"sap-phones.firebaseapp.com",
  projectId:"sap-phones",
  storageBucket:"sap-phones.firebasestorage.app",
  messagingSenderId:"865821975787",
  appId:"1:865821975787:web:48a4e9392d6366d2bacaae",
  measurementId:"G-EKSWTEG6ZL"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

// ========== ADMIN PASSWORD (hindura iyi) ==========
const ADMIN_PASSWORD = "admin1234";

const $=id=>document.getElementById(id);
const money=n=>Number(n||0).toLocaleString()+" RWF";
const fmtDate=ts=>{
  if(!ts?.seconds) return "-";
  const d=new Date(ts.seconds*1000);
  return d.toLocaleDateString("rw-RW")+" "+d.toLocaleTimeString("rw-RW",{hour:"2-digit",minute:"2-digit"});
};

let allUsers=[], allDeposits=[], allWithdrawals=[], allInvestments=[];
let depFilter="all", withFilter="all";
let unsubs=[];

window.adminLogin=function(){
  const pass=$("adminPass").value;
  if(pass===ADMIN_PASSWORD){
    sessionStorage.setItem("sap_admin","1");
    $("loginScreen").classList.add("hidden");
    $("dashScreen").classList.remove("hidden");
    startListeners();
  }else{
    $("loginMsg").textContent="❌ Ijambo ry'ibanga si ryo.";
  }
};

window.adminLogout=function(){
  sessionStorage.removeItem("sap_admin");
  unsubs.forEach(u=>u&&u());
  unsubs=[];
  $("dashScreen").classList.add("hidden");
  $("loginScreen").classList.remove("hidden");
  $("adminPass").value="";
};

// Auto login if session exists
if(sessionStorage.getItem("sap_admin")==="1"){
  $("loginScreen").classList.add("hidden");
  $("dashScreen").classList.remove("hidden");
  startListeners();
}

function startListeners(){
  // Users
  unsubs.push(onSnapshot(query(collection(db,"users"),limit(200)),snap=>{
    allUsers=snap.docs.map(d=>({id:d.id,...d.data()}));
    $("statUsers").textContent=allUsers.length;
    renderUsers();
  }));

  // Deposits
  unsubs.push(onSnapshot(query(collection(db,"deposits"),limit(100)),snap=>{
    allDeposits=snap.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    $("statDep").textContent=allDeposits.filter(d=>d.status==="pending").length;
    renderDeposits();
  }));

  // Withdrawals
  unsubs.push(onSnapshot(query(collection(db,"withdrawals"),limit(100)),snap=>{
    allWithdrawals=snap.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    $("statWith").textContent=allWithdrawals.filter(d=>d.status==="pending").length;
    renderWithdrawals();
  }));

  // Investments
  unsubs.push(onSnapshot(query(collection(db,"investments"),limit(100)),snap=>{
    allInvestments=snap.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
    $("statInv").textContent=allInvestments.length;
    renderInvestments();
  }));
}

// ========== TABS ==========
window.showTab=function(name){
  ["users","deposits","withdrawals","investments"].forEach(t=>{
    $("panel"+t.charAt(0).toUpperCase()+t.slice(1)).classList.add("hidden");
    $("tab"+t.charAt(0).toUpperCase()+t.slice(1)).classList.remove("on");
  });
  $("panel"+name.charAt(0).toUpperCase()+name.slice(1)).classList.remove("hidden");
  $("tab"+name.charAt(0).toUpperCase()+name.slice(1)).classList.add("on");
};

// ========== USERS ==========
function renderUsers(){
  const q=($("searchUser")?.value||"").toLowerCase();
  const list=allUsers.filter(u=>{
    if(!q) return true;
    return (u.name||"").toLowerCase().includes(q)||(u.phone||"").includes(q)||(u.email||"").toLowerCase().includes(q);
  });
  if(!list.length){$("usersList").innerHTML="<div class='empty'>Nta mukoresha</div>";return}
  $("usersList").innerHTML=list.map(u=>`
    <div class="card">
      <div class="row">
        <div>
          <h3>${u.name||"-"}</h3>
          <div class="muted">${u.phone||"-"} • ${u.referralCode||""}</div>
          <div class="muted" style="margin-top:4px">Balance: <b style="color:#38bdf8">${money(u.balance)}</b> • Withdrawable: ${money(u.withdrawable)} • Inyungu: ${money(u.profit)}</div>
          <div class="muted">Rewards: ${money(u.rewards)} • Status: ${u.status||"active"}</div>
        </div>
        <div>
          <button class="btn sm gray" onclick="editBalance('${u.id}',${u.balance||0})">Hindura balance</button>
        </div>
      </div>
    </div>`).join("");
}

window.filterUsers=function(){renderUsers()};

window.editBalance=async function(uid,current){
  const val=prompt("Andika balance nshya (RWF):",current);
  if(val===null) return;
  const num=Number(val);
  if(isNaN(num)||num<0){alert("Umubare si wo.");return}
  try{
    await updateDoc(doc(db,"users",uid),{balance:num});
    alert("✅ Balance yahinduwe.");
  }catch(e){alert("Ikibazo: "+e.message)}
};

// ========== DEPOSITS ==========
window.filterDep=function(f){
  depFilter=f;
  ["depAll","depPending","depApproved"].forEach(id=>$(id).classList.remove("on"));
  if(f==="all")$("depAll").classList.add("on");
  if(f==="pending")$("depPending").classList.add("on");
  if(f==="approved")$("depApproved").classList.add("on");
  renderDeposits();
};

function renderDeposits(){
  let list=allDeposits;
  if(depFilter!=="all") list=list.filter(d=>d.status===depFilter);
  if(!list.length){$("depositsList").innerHTML="<div class='empty'>Nta deposit</div>";return}
  $("depositsList").innerHTML=list.map(d=>{
    const user=allUsers.find(u=>u.id===d.uid||u.uid===d.uid);
    return `<div class="card">
      <div class="row">
        <div>
          <h3>${money(d.amount)}</h3>
          <div class="muted">${user?.name||d.uid} • ${user?.phone||"-"}</div>
          <div class="muted">Yishyuye na: ${d.payerPhone||"-"} • ${fmtDate(d.createdAt)}</div>
          <div class="muted">Ref: ${d.reference||"-"}</div>
        </div>
        <div style="text-align:right">
          <span class="pill ${d.status}">${d.status==="pending"?"Bitegereje":d.status==="approved"?"Byemejwe":d.status}</span>
          ${d.status==="pending"?`<div class="actions-cell" style="margin-top:8px">
            <button class="btn sm green" onclick="approveDeposit('${d.id}','${d.uid}',${d.amount})">Emeza</button>
            <button class="btn sm red" onclick="rejectDeposit('${d.id}')">Anga</button>
          </div>`:""}
        </div>
      </div>
    </div>`;
  }).join("");
}

window.approveDeposit=async function(depId,uid,amount){
  if(!confirm("Emeza deposit ya "+money(amount)+"?")) return;
  try{
    await updateDoc(doc(db,"deposits",depId),{status:"approved",processedAt:new Date()});
    await updateDoc(doc(db,"users",uid),{balance:increment(amount)});
    alert("✅ Deposit yemejwe. Balance yahinduwe.");
  }catch(e){alert("Ikibazo: "+e.message)}
};

window.rejectDeposit=async function(depId){
  if(!confirm("Anga iyi deposit?")) return;
  try{
    await updateDoc(doc(db,"deposits",depId),{status:"rejected",processedAt:new Date()});
    alert("Deposit yanzwe.");
  }catch(e){alert("Ikibazo: "+e.message)}
};

// ========== WITHDRAWALS ==========
window.filterWith=function(f){
  withFilter=f;
  ["withAll","withPending","withApproved"].forEach(id=>$(id).classList.remove("on"));
  if(f==="all")$("withAll").classList.add("on");
  if(f==="pending")$("withPending").classList.add("on");
  if(f==="approved")$("withApproved").classList.add("on");
  renderWithdrawals();
};

function renderWithdrawals(){
  let list=allWithdrawals;
  if(withFilter!=="all") list=list.filter(d=>d.status===withFilter);
  if(!list.length){$("withdrawalsList").innerHTML="<div class='empty'>Nta withdrawal</div>";return}
  $("withdrawalsList").innerHTML=list.map(d=>{
    const user=allUsers.find(u=>u.id===d.uid||u.uid===d.uid);
    return `<div class="card">
      <div class="row">
        <div>
          <h3>${money(d.amount)}</h3>
          <div class="muted">${user?.name||d.uid} • ${user?.phone||"-"}</div>
          <div class="muted">Yoherezwa kuri: ${d.phone||"-"} • ${fmtDate(d.createdAt)}</div>
        </div>
        <div style="text-align:right">
          <span class="pill ${d.status}">${d.status==="pending"?"Bitegereje":d.status==="approved"?"Byemejwe":d.status}</span>
          ${d.status==="pending"?`<div class="actions-cell" style="margin-top:8px">
            <button class="btn sm green" onclick="approveWithdraw('${d.id}')">Emeza</button>
            <button class="btn sm red" onclick="rejectWithdraw('${d.id}','${d.uid}',${d.amount})">Anga</button>
          </div>`:""}
        </div>
      </div>
    </div>`;
  }).join("");
}

window.approveWithdraw=async function(id){
  if(!confirm("Emeza withdrawal? (Amafaranga yoherejwe)")) return;
  try{
    await updateDoc(doc(db,"withdrawals",id),{status:"approved",processedAt:new Date()});
    alert("✅ Withdrawal yemejwe.");
  }catch(e){alert("Ikibazo: "+e.message)}
};

window.rejectWithdraw=async function(id,uid,amount){
  if(!confirm("Anga withdrawal? Amafaranga azasubizwa muri withdrawable.")) return;
  try{
    await updateDoc(doc(db,"withdrawals",id),{status:"rejected",processedAt:new Date()});
    await updateDoc(doc(db,"users",uid),{withdrawable:increment(amount)});
    alert("Withdrawal yanzwe. Amafaranga yasubijwe.");
  }catch(e){alert("Ikibazo: "+e.message)}
};

// ========== INVESTMENTS ==========
function renderInvestments(){
  if(!allInvestments.length){$("investmentsList").innerHTML="<div class='empty'>Nta mugabane</div>";return}
  $("investmentsList").innerHTML=allInvestments.map(inv=>{
    const user=allUsers.find(u=>u.id===inv.uid||u.uid===inv.uid);
    return `<div class="card">
      <div class="row">
        <div>
          <h3>${inv.shareName||"VIP"}</h3>
          <div class="muted">${user?.name||inv.uid} • ${user?.phone||"-"}</div>
          <div class="muted">${money(inv.amount)} • Buri munsi: ${money(inv.daily||0)} • ${fmtDate(inv.createdAt)}</div>
        </div>
        <div style="text-align:right">
          <span class="pill ${inv.status||"pending"}">${inv.status==="pending"?"Bitegereje":inv.status==="active"?"Birakora":inv.status||"pending"}</span>
          ${inv.status==="pending"?`<div style="margin-top:8px">
            <button class="btn sm green" onclick="activateInvest('${inv.id}')">Kora Active</button>
          </div>`:""}
        </div>
      </div>
    </div>`;
  }).join("");
}

window.activateInvest=async function(id){
  if(!confirm("Shyira iyi investment muri active?")) return;
  try{
    await updateDoc(doc(db,"investments",id),{status:"active",activatedAt:new Date()});
    alert("✅ Investment irakora.");
  }catch(e){alert("Ikibazo: "+e.message)}
};
</script>
</body>
</html>
